<svg xmlns="http://www.w3.org/2000/svg" width="760" height="315" viewBox="0 0 760 315" role="img">
<rect width="760" height="315" fill="#FFFFFF"/>
<text x="28" y="36" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#1A1A1A" text-anchor="start" font-weight="600">GHK-Cu — frequency</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5F6B6A" text-anchor="start" font-weight="normal">272 reports on GHK-Cu. Percent of reports, with 95% interval and count.</text>
<text x="28" y="110" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="start" font-weight="normal">Once a day</text>
<rect x="278" y="100" width="120.7" height="12" fill="#1F6F6B"/>
<text x="732" y="110" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="end" font-weight="normal">39.7%  (34–46)   n=108</text>
<text x="28" y="136" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="start" font-weight="normal">5 days on / 2 days off</text>
<rect x="278" y="126" width="61.5" height="12" fill="#1F6F6B"/>
<text x="732" y="136" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="end" font-weight="normal">20.2%  (16–25)   n=55</text>
<text x="28" y="162" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="start" font-weight="normal">2–3 times a week</text>
<rect x="278" y="152" width="39.1" height="12" fill="#1F6F6B"/>
<text x="732" y="162" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="end" font-weight="normal">12.9%  (9–17)   n=35</text>
<text x="28" y="188" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="start" font-weight="normal">About once a week</text>
<rect x="278" y="178" width="29.1" height="12" fill="#1F6F6B"/>
<text x="732" y="188" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="end" font-weight="normal">9.6%  (7–14)   n=26</text>
<text x="28" y="214" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="start" font-weight="normal">More than once a day</text>
<rect x="278" y="204" width="22.4" height="12" fill="#1F6F6B"/>
<text x="732" y="214" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="end" font-weight="normal">7.4%  (5–11)   n=20</text>
<text x="28" y="240" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="start" font-weight="normal">In cycles (weeks on, weeks off)</text>
<rect x="278" y="230" width="19.0" height="12" fill="#1F6F6B"/>
<text x="732" y="240" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="end" font-weight="normal">6.2%  (4–10)   n=17</text>
<text x="28" y="266" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="start" font-weight="normal">Other (not listed)</text>
<rect x="278" y="256" width="12.3" height="12" fill="#1F6F6B"/>
<text x="732" y="266" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="end" font-weight="normal">4.0%  (2–7)   n=11</text>
<line x1="28" y1="283" x2="732" y2="283" stroke="#D8DEDD" stroke-width="1"/>
<text x="28" y="301" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5F6B6A" text-anchor="start" font-weight="normal">Self-reported. Not evidence of effectiveness or safety. See methodology.</text>
<text x="732" y="301" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5F6B6A" text-anchor="end" font-weight="normal">Private Anecdata · EXAMPLE-SYNTHETIC · n = 272</text>
